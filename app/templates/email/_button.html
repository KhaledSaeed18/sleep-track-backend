{% macro button(href, label) -%}
<p style="margin:28px 0;">
  <a href="{{ href }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:600;">{{ label }}</a>
</p>
<p style="font-size:13px;color:#6b7280;">If the button doesn't work, paste this link into your browser:<br><a href="{{ href }}" style="color:#4f46e5;word-break:break-all;">{{ href }}</a></p>
{%- endmacro %}
