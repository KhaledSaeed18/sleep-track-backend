name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m app.scripts.export_openapi /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json || {
            echo "::error::docs/openapi.json is stale. Run 'make openapi' and commit the result."
            exit 1
          }

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sleeptrack
          POSTGRES_PASSWORD: sleeptrack
          POSTGRES_DB: sleeptrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sleeptrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sleeptrack:sleeptrack@localhost:5432/sleeptrack_test
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://sleeptrack:sleeptrack@localhost:5432/sleeptrack
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Run tests
        run: >-
          uv run pytest
          --cov --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85 --junitxml=junit.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sleeptrack-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run --rm sleeptrack-api:ci python -c "import app.main; print('import ok')"
          docker run --rm --entrypoint id sleeptrack-api:ci -u | grep -qv '^0$'
